<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LAZÚLI | Perfumaria de Luxo</title>
    <style>
        :root {
            --azul-escuro: #071327;
            --azul-medio: #1d3557;
            --azul-bebe: #d4eaf7;
            --azul-destaque: #457b9d;
            --branco: #ffffff;
            --cinza-suave: #f8fafc;
            --texto-escuro: #0f172a;
            --pix: #22c55e;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }

        body {
            background-color: var(--cinza-suave);
            color: var(--texto-escuro);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* BANNER DE AVISO MINIMALISTA */
        .top-notice {
            background-color: var(--azul-escuro);
            color: var(--azul-bebe);
            text-align: center;
            padding: 8px;
            font-size: 0.75rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* NAVEGAÇÃO / HEADER */
        header {
            background-color: var(--branco);
            padding: 1.5rem 3rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--azul-bebe);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand {
            font-size: 2.2rem;
            font-weight: 300;
            letter-spacing: 6px;
            color: var(--azul-escuro);
            text-decoration: none;
            text-transform: uppercase;
        }

        .brand span {
            font-weight: 800;
            color: var(--azul-destaque);
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 2rem;
        }

        nav a {
            color: var(--azul-escuro);
            text-decoration: none;
            font-size: 0.85rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            font-weight: 600;
            cursor: pointer;
            transition: color 0.3s;
        }

        nav a:hover, nav a.active {
            color: var(--azul-destaque);
        }

        /* SISTEMA SPA DE PÁGINAS */
        .page {
            display: none;
            max-width: 1100px;
            margin: 0 auto;
            padding: 3rem 1.5rem;
            width: 100%;
            animation: fadeIn 0.4s ease;
        }

        .page.active-page {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* HERO CLEAN E ELEGANTE */
        .hero-clean {
            display: flex;
            align-items: center;
            gap: 3rem;
            background-color: var(--branco);
            border-radius: 20px;
            padding: 3rem;
            border: 1px solid var(--azul-bebe);
            margin-bottom: 3rem;
        }

        .hero-text {
            flex: 1;
        }

        .hero-text h1 {
            font-size: 3rem;
            font-weight: 300;
            color: var(--azul-escuro);
            line-height: 1.1;
            margin-bottom: 1rem;
        }

        .hero-text p {
            color: var(--azul-medio);
            font-size: 1rem;
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        .hero-img {
            flex: 1;
            border-radius: 12px;
            overflow: hidden;
        }

        .hero-img img {
            width: 100%;
            height: 350px;
            object-fit: cover;
        }

        .btn-minimal {
            background-color: var(--azul-escuro);
            color: var(--branco);
            padding: 14px 28px;
            border: none;
            border-radius: 4px;
            font-size: 0.8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.3s;
            text-decoration: none;
            display: inline-block;
        }

        .btn-minimal:hover {
            background-color: var(--azul-destaque);
        }

        /* SEÇÃO E CARDS DE PERFUMES */
        .section-head {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .section-head h2 {
            font-size: 1.8rem;
            font-weight: 300;
            letter-spacing: 3px;
            color: var(--azul-escuro);
            text-transform: uppercase;
        }

        .grid-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 2rem;
        }

        .card {
            background-color: var(--branco);
            border-radius: 12px;
            padding: 1.2rem;
            border: 1px solid var(--azul-bebe);
            text-align: center;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(7, 19, 39, 0.05);
        }

        .card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 1rem;
        }

        .card h3 {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--azul-escuro);
            margin-bottom: 0.3rem;
        }

        .card span {
            font-size: 0.75rem;
            letter-spacing: 1px;
            color: var(--azul-destaque);
            text-transform: uppercase;
            display: block;
            margin-bottom: 0.8rem;
        }

        .card .price {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--azul-escuro);
            margin-bottom: 1rem;
        }

        /* CATÁLOGO FILTROS */
        .filters {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 2rem;
        }
